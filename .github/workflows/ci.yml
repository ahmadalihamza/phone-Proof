name: PhoneProof checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -c backend/requirements-tested.txt -r backend/requirements-dev.txt
      - run: pip-audit --strict
      - run: python tools/generate_registry.py && git diff --exit-code contracts docs/diagnostic-registry.md
      - working-directory: backend
        run: ruff check app tests && pytest -q && alembic upgrade head && alembic check
      - run: python tools/smoke_backend.py
      - run: docker build -f backend/Dockerfile .
  backend-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phoneproof
          POSTGRES_PASSWORD: acceptance-only
          POSTGRES_DB: phoneproof_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U phoneproof -d phoneproof_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://phoneproof:acceptance-only@localhost:5432/phoneproof_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -c backend/requirements-tested.txt -r backend/requirements-dev.txt
      - working-directory: backend
        run: pytest -q tests/test_postgresql.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - working-directory: android
        run: gradle :app:assembleDebug :app:testDebugUnitTest :diagnostics:testDebugUnitTest :app:lintDebug
      - run: python tools/verify_android_artifacts.py
      - uses: actions/upload-artifact@v4
        with: {name: phoneproof-debug, path: android/app/build/outputs/apk/debug/*.apk}
