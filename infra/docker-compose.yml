services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: phoneproof
      POSTGRES_USER: phoneproof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoneproof"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://phoneproof:${POSTGRES_PASSWORD}@postgres:5432/phoneproof
      REDIS_URL: redis://redis:6379/0
    volumes:
      - runtime:/srv/backend/runtime
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
  mail:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.mail_delivery", "--watch", "--interval", "60"]
    profiles: ["mail"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://phoneproof:${POSTGRES_PASSWORD}@postgres:5432/phoneproof
      REDIS_URL: redis://redis:6379/0
    volumes:
      - runtime:/srv/backend/runtime
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.worker.celery", "worker", "--loglevel=info", "--concurrency=1"]
    profiles: ["ml"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://phoneproof:${POSTGRES_PASSWORD}@postgres:5432/phoneproof
      REDIS_URL: redis://redis:6379/0
    volumes:
      - runtime:/srv/backend/runtime
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  payments:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.reconcile_payments", "--watch", "--interval", "60"]
    profiles: ["payments"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://phoneproof:${POSTGRES_PASSWORD}@postgres:5432/phoneproof
      REDIS_URL: redis://redis:6379/0
    volumes:
      - runtime:/srv/backend/runtime
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
  runtime:
